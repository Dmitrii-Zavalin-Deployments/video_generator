  validation_tests:
    name: "🔬 Validation Tests"
    # needs: verification_tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Fix APT Mirrors
        run: |
          # Prevent runner hangs on Azure regional mirrors globally for the job
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true

      # 🔧 ROBOT B IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot B Identity & Notes
        run: |
          # Normalize branch name for safe use in email (replace "/" with "-")
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"

          # Set dynamic Robot B identity per branch
          git config --global user.name "Automation Engine B (${BRANCH_SAFE})"
          git config --global user.email "automation_b+${BRANCH_SAFE}@yourdomain"

          # Ensure Git Notes are rewritten and preserved
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Provision Environment Layers & C++ Build (Pip & CMake)
        run: |
          python -m pip install --upgrade pip
          chmod +x requirements.sh
          ./requirements.sh

